<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Candidate Matching</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --text:#111827; --muted:#6b7280;
    --primary:#2563eb; --primary-d:#1d4ed8; --ok:#16a34a; --warn:#ea580c; --bad:#dc2626;
    --chip:#eff6ff;
  }
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;}
  h1{font-size:20px;font-weight:650;letter-spacing:-.01em;}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .head-right{display:flex;align-items:center;gap:10px;flex:none;}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;white-space:nowrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.13);}
  .dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(234,88,12,.13);}
  .langbox{position:relative;}
  .langbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--card);border-radius:8px;padding:6px 12px;font-size:12.5px;
    color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .langbtn:hover{border-color:var(--primary);color:var(--primary);}
  .langbtn .caret{font-size:9px;opacity:.6;}
  .langmenu{position:absolute;right:0;top:calc(100% + 6px);min-width:104px;background:#fff;
    border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 20px rgba(16,24,40,.10);
    padding:4px;display:none;z-index:60;}
  .langmenu.on{display:block;}
  .langitem{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:7px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;color:var(--text);
    font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em;}
  .langitem:hover{background:#f3f4f6;}
  .langitem.on{color:var(--primary);font-weight:700;}
  .langitem .tick{font-size:11px;opacity:0;}
  .langitem.on .tick{opacity:1;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card + .card{margin-top:16px;}
  .label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;display:block;}

  .drop{border:1.5px dashed #d1d5db;border-radius:11px;padding:26px 18px;text-align:center;
    cursor:pointer;transition:.15s;background:#fbfbfc;}
  .drop:hover,.drop.hot{border-color:var(--primary);background:var(--chip);}
  .drop b{font-size:13.5px;}
  .drop span{display:block;font-size:12px;color:var(--muted);margin-top:4px;}
  .drop .picked{color:var(--primary);font-weight:600;font-size:13px;margin-top:6px;}

  textarea{width:100%;min-height:132px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    font-size:13.5px;font-family:inherit;resize:vertical;background:#fbfbfc;color:var(--text);}
  textarea:focus{outline:none;border-color:var(--primary);background:#fff;}

  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  button{border:none;border-radius:9px;padding:10px 20px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:.15s;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-d);}
  .btn-primary:disabled{background:#c7d2fe;cursor:not-allowed;}
  .btn-ghost{background:#f3f4f6;color:var(--text);}
  .btn-ghost:hover{background:#e5e7eb;}
  select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;
    background:#fff;font-family:inherit;color:var(--text);}

  .examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .chip{background:var(--chip);color:#1e40af;border:1px solid #dbeafe;border-radius:8px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.15s;}
  .chip:hover{background:#dbeafe;}
  .chip.plain{background:#f3f4f6;color:var(--muted);border-color:var(--line);cursor:default;}

  .loading{display:none;align-items:center;gap:13px;padding:26px 4px;}
  .spinner{width:19px;height:19px;border:2.5px solid #e5e7eb;border-top-color:var(--primary);
    border-radius:50%;animation:spin .8s linear infinite;flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .steps{font-size:13px;color:var(--muted);}

  .err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;
    border-radius:11px;padding:13px 16px;font-size:13px;margin-top:14px;}
  .err.show{display:block;}

  /* 结果 */
  #result{display:none;}
  .jdbox{background:#fbfbfc;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:18px;}
  .jdbox h2{font-size:15.5px;font-weight:650;margin-bottom:8px;}
  .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
  .tag{font-size:11.5px;background:#f3f4f6;color:#374151;border-radius:6px;padding:3px 9px;}
  .tag.skill{background:#ecfdf5;color:#065f46;}
  .tag.miss{background:#fef3c7;color:#92400e;}

  .hit{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);}
  .hit:first-of-type{border-top:none;padding-top:6px;}
  .rank{width:28px;height:28px;border-radius:8px;background:#f3f4f6;color:#374151;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
  .rank.top{background:#fef3c7;color:#92400e;}
  .hit-main{flex:1;min-width:0;}
  .hit-title{font-size:14.5px;font-weight:640;}
  .hit-title .ref{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:6px;}
  .hit-sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .hit-reason{font-size:12.5px;color:#374151;margin-top:7px;background:#f9fafb;
    border-left:2.5px solid #d1d5db;padding:6px 10px;border-radius:0 6px 6px 0;}
  .hit-skills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .hit-skills span{font-size:11px;background:#eff6ff;color:#1e40af;border-radius:5px;padding:2px 7px;}
  .score{font-size:17px;font-weight:700;color:var(--primary);white-space:nowrap;padding-left:10px;}
  .expand{margin-top:9px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;}
  .expand:hover{color:var(--primary);}
  .bars{margin-top:9px;display:none;}
  .bars.open{display:block;}
  .bar{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .bar .bn{width:92px;flex:none;text-align:right;}
  .bar .bt{flex:1;height:7px;background:#eef2f7;border-radius:4px;overflow:hidden;
    box-shadow:inset 0 1px 1px rgba(16,24,40,.04);}
  .bar .bf{display:block;height:100%;border-radius:4px;transition:width .28s ease;}
  .bar .bf.hi{background:linear-gradient(90deg,#60a5fa,#2563eb);}
  .bar .bf.mid{background:linear-gradient(90deg,#bfdbfe,#60a5fa);}
  .bar .bf.low{background:linear-gradient(90deg,#fde68a,#f59e0b);}
  .bar .bf.zero{background:#e5e7eb;}
  .bar .bv{width:36px;flex:none;text-align:right;font-variant-numeric:tabular-nums;}
  .bar .bv.hi{color:var(--primary-d);font-weight:700;}
  .bar .bv.mid{color:#3b82f6;font-weight:600;}
  .bar .bv.low{color:#b45309;}
  .bar .bv.zero{color:#c1c7d0;}

  /* 简历详情抽屉 */
  .open-link{margin-top:9px;font-size:12px;color:var(--primary);cursor:pointer;display:inline-block;}
  .open-link:hover{text-decoration:underline;}
  .mask{position:fixed;inset:0;background:rgba(17,24,39,.34);opacity:0;pointer-events:none;
    transition:.2s;z-index:40;}
  .mask.on{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(580px,94vw);background:#fff;
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;
    z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(16,24,40,.08);}
  .drawer.on{transform:none;}
  .dh{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:flex-start;gap:12px;flex:none;}
  .dh-t{font-size:15px;font-weight:650;}
  .dh-s{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .close{border:none;background:#f3f4f6;border-radius:8px;width:29px;height:29px;
    cursor:pointer;font-size:16px;color:#6b7280;line-height:1;flex:none;}
  .close:hover{background:#e5e7eb;}
  .db{overflow-y:auto;padding:4px 20px 48px;flex:1;}
  .sec{font-size:11.5px;font-weight:700;color:#9ca3af;letter-spacing:.06em;
    text-transform:uppercase;margin:20px 0 9px;}
  .kv{display:grid;grid-template-columns:84px 1fr;gap:5px 12px;font-size:13px;}
  .kv .k{color:#9ca3af;}
  .pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.78;
    color:#374151;background:#fbfbfc;border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;font-family:ui-monospace,Consolas,"Courier New",monospace;}

  /* 选中文件后的即时预览 */
  #preview{margin-top:12px;display:none;}
  .pv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-bottom:7px;flex-wrap:wrap;}
  .pv-info{font-size:12.5px;color:var(--muted);}
  .pv-info b{color:var(--text);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="appTitle">AI Candidate Matching</h1>
      <div class="sub" id="appSub"></div>
    </div>
    <div class="head-right">
      <div class="status"><span id="dot" class="dot"></span><span id="stxt"></span></div>
      <div class="langbox">
        <button class="langbtn" id="langBtn" onclick="toggleLangMenu(event)">
          <span data-i18n="lang.button">Language</span><span class="caret">▼</span>
        </button>
        <div class="langmenu" id="langMenu">
          <div class="langitem" data-lang="zh" onclick="setLang('zh')">ZH<span class="tick">✓</span></div>
          <div class="langitem" data-lang="en" onclick="setLang('en')">EN<span class="tick">✓</span></div>
        </div>
      </div>
    </div>
  </header>

  <div class="card" id="libCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label class="label" style="margin:0" data-i18n="lib.title"></label>
      <span class="open-link" style="margin:0" onclick="toggleLib()" id="libToggle"></span>
    </div>
    <div id="libstat" style="font-size:12.5px;color:var(--muted);margin-top:8px"></div>

    <div id="libBody" style="display:none;margin-top:14px">
      <div class="row" style="margin-top:0">
        <select id="upKind" onchange="loadGroups(); loadLibrary()">
          <option value="cv" data-i18n="lib.kind.cv"></option>
          <option value="jd" data-i18n="lib.kind.jd"></option>
        </select>
        <select id="upGroup"></select>
        <button class="btn-ghost" style="padding:8px 14px" onclick="newGroup()" data-i18n="lib.newgroup"></button>
      </div>

      <div class="row">
        <button class="btn-ghost" onclick="$('upFiles').click()" data-i18n="lib.pickfiles"></button>
        <span class="pv-info" id="upInfo" data-i18n="lib.formats"></span>
      </div>
      <input type="file" id="upFiles" multiple accept=".pdf,.docx,.doc,.txt,.md" style="display:none">

      <div class="row">
        <button class="btn-primary" id="btnLabel" onclick="startLabel()"></button>
        <span class="pv-info" id="labelInfo"></span>
      </div>

      <div id="labelProgress" style="display:none;margin-top:10px">
        <div class="bar"><span class="bn" style="width:52px" data-i18n="lib.progress"></span>
          <span class="bt"><span class="bf" id="lpBar" style="width:0%"></span></span>
          <span class="bv" id="lpPct">0%</span></div>
        <div class="pv-info" id="lpMsg" style="margin-top:6px"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <label class="label" data-i18n="up.step1"></label>
    <div class="drop" id="drop">
      <b data-i18n="up.drop.title"></b>
      <span data-i18n="up.drop.sub"></span>
      <div class="picked" id="picked" style="display:none"></div>
    </div>
    <input type="file" id="file" accept=".txt,.md,.pdf,.docx" style="display:none">
    <div id="preview"></div>

    <div class="row" style="margin-top:12px">
      <span style="font-size:12.5px;color:var(--muted)" data-i18n="up.or"></span>
    </div>
    <textarea id="text"></textarea>

    <div class="row">
      <button class="btn-primary" id="go" data-i18n="up.go"></button>
      <button class="btn-ghost" id="clear" data-i18n="up.clear"></button>
      <select id="top">
        <option value="5" selected data-i18n="up.top5"></option>
        <option value="10" data-i18n="up.top10"></option>
        <option value="3" data-i18n="up.top3"></option>
      </select>
    </div>

    <div class="row" style="margin-top:18px;display:block">
      <span style="font-size:12.5px;color:var(--muted)" data-i18n="up.step2"></span>
      <div class="examples" id="examples"></div>
    </div>
  </div>

  <div class="card">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="err" id="err"></div>
    <div id="result"></div>
  </div>
</div>

<div class="mask" id="mask" onclick="closeDetail()"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div>
      <div class="dh-t" id="d-title"></div>
      <div class="dh-s" id="d-sub"></div>
    </div>
    <button class="close" onclick="closeDetail()">×</button>
  </div>
  <div class="db" id="d-body"></div>
</aside>

let LANG = localStorage.getItem('lang') ||
  ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
if (!I18N[LANG]) LANG = 'en';

function fmt(s, p) {
  if (!p) return s;
  return String(s).replace(/\{(\w+)\}/g, (m, k) => (p[k] != null ? p[k] : m));
}
function t(key, p) {
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  return fmt(s, p);
}
function apiErr(d) {
  if (d && d.error_key) {
    const k = 'err.' + d.error_key;
    const s = I18N[LANG] && I18N[LANG][k];
    if (s) return fmt(s, d.error_args || {});
  }
  return (d && d.error) || 'Error';
}

/* 选中文件后立刻解析，但不展示正文——只给一个「打开看看」按钮 */
async function doPreview(file) {
  pickedFile = file;
  previewName = null;
  lastPreview = null;
  $('picked').style.display = 'block';
  $('picked').textContent = t('up.reading', { f: file.name });
  $('preview').style.display = 'none';

  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/preview', { method: 'POST', body: fd });
    const d = await r.json();
    if (!d.ok) {
      $('picked').textContent = t('up.selected.nopreview', { f: file.name });
      renderPreviewError(apiErr(d));
      return;
    }
    previewName = d.upload_name;
    lastPreview = d;
    $('picked').textContent = t('up.selected', { f: d.name, n: d.chars.toLocaleString() });
    renderPreview();
  } catch (e) {
    $('picked').textContent = t('up.selected.readfail', { f: file.name });
    renderPreviewError(t('up.readfail', { e: e.message }));
  }
}

function renderPreview() {
  if (!lastPreview) return;
  $('preview').style.display = 'block';
  $('preview').innerHTML = `
    <div class="pv-head">
      <span class="pv-info">${t('up.selected.chars', {
        f: esc(lastPreview.name), n: lastPreview.chars.toLocaleString() })}</span>
      <button class="btn-ghost" style="padding:7px 15px;font-size:12.5px"
        onclick="openFile('upload','${esc(lastPreview.upload_name)}')">${t('up.openlook')}</button>
    </div>`;
}

function renderPreviewError(msg) {
  $('preview').style.display = 'block';
  $('preview').innerHTML = `<div class="err show" style="margin-top:0">${esc(msg)}</div>`;
}

$('clear').onclick = () => {

  $('picked').style.display = 'none';
  $('preview').style.display = 'none'; $('preview').innerHTML = '';

/* ===================== 提交匹配 ===================== */
$('go').onclick = async () => {
  const text = $('text').value.trim();
  if (!pickedFile && !text) { showErr(t('up.needinput')); return; }
  startLoading();
  const fd = new FormData();
  if (previewName) fd.append('upload_name', previewName);
  else if (pickedFile) fd.append('file', pickedFile);
  fd.append('text', text);
  fd.append('top', $('top').value);
  try {
    const r = await fetch('/api/match', { method: 'POST', body: fd });
    const d = await r.json();
    if (!d.ok) { stopLoading(); showErr(apiErr(d)); return; }
    stopLoading(); render(d);
  } catch (e) { stopLoading(); showErr(t('up.reqfail', { e: e.message })); }
};

async function runById(id, label) {
  startLoading(t('up.loading.jd', { t: label }));
  try {
    const r = await fetch('/api/match-id', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jd_id: id, top: +$('top').value })
    });
    const d = await r.json();
    if (!d.ok) { stopLoading(); showErr(apiErr(d)); return; }
    stopLoading(); render(d);
  } catch (e) { stopLoading(); showErr(t('up.reqfail', { e: e.message })); }
}

const STEP_KEYS = ['step.read', 'step.extract', 'step.embed', 'step.rank'];
let stepTimer = null;
function startLoading(first) {
  $('err').classList.remove('show');
  $('result').style.display = 'none';
  $('loading').style.display = 'flex';
  $('go').disabled = true;
  let i = 0;
  $('steps').textContent = first || t(STEP_KEYS[0]);
  clearInterval(stepTimer);
  stepTimer = setInterval(() => {
    i = Math.min(i + 1, STEP_KEYS.length - 1);
    $('steps').textContent = t(STEP_KEYS[i]);
  }, 4000);
}
function stopLoading() {
  clearInterval(stepTimer);
  $('loading').style.display = 'none';
  $('go').disabled = false;
}
function showErr(m) { $('err').textContent = m; $('err').classList.add('show'); }

/* ===================== 理由的结构化渲染 ===================== */
function reasonText(h) {
  const f = h.reason_facts;
  if (!f || !f.length) return h.reason || '';
  const zh = LANG === 'zh';
  const parts = [];
  f.forEach(x => {
    if (x.k === 'skill') {
      let s = t('rs.skill', { h: x.hit, t: x.total });
      if (x.names && x.names.length) {
        s += (zh ? '（' : ' (') + x.names.join(zh ? '、' : ', ') + (zh ? '）' : ')');
      }
      parts.push(s);
    } else if (x.k === 'years') {
      let s = t('rs.years', { y: trimNum(x.y) });
      if (x.req != null) s += (zh ? '' : ' ') + t('rs.years_req', { r: x.req });
      parts.push(s);
    } else if (x.k === 'loc') {
      parts.push(x.same ? t('rs.same') : t('rs.diff', { c: x.cv }));
    } else if (x.k === 'sen') {
      parts.push(t('rs.sen', { s: x.v }));
    }
  });
  return parts.join(zh ? '；' : '; ');
}
function trimNum(v) {
  const n = Number(v);
  return Number.isFinite(n) ? String(Math.round(n * 10) / 10) : v;
}

function featureLabel(k) {
  const s = I18N[LANG] && I18N[LANG]['feat.' + k];
  return s || k;
}
function barsHTML(features) {
  const items = Object.entries(features || {}).map(([k, v]) => {
    const val = Math.max(0, Math.min(1, Number(v) || 0));
    const pct = val <= 0 ? 0 : Math.max(2, val * 100);
    const lv = val >= 0.75 ? 'hi' : val >= 0.4 ? 'mid' : val > 0 ? 'low' : 'zero';
    const html = `<div class="bar"><span class="bn">${esc(featureLabel(k))}</span>
      <span class="bt"><span class="bf ${lv}" style="width:${pct.toFixed(1)}%"></span></span>
      <span class="bv ${lv}">${val.toFixed(2)}</span></div>`;
    return { val, html };
  });
  /* 高分项排前面，一眼看出这个人靠哪几项拿分 */
  items.sort((a, b) => b.val - a.val);
  return items.map(x => x.html).join('');
}

    : (d.jd_id ? { kind: 'jd', name: d.jd_id } : null);

  let html = `<div class="jdbox">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">
      <h2 style="margin:0">${esc(jd.position || t('res.unknown.position'))}</h2>

        onclick="openFile('${jdFile.kind}','${esc(jdFile.name)}')">${t('res.openjd')}</span>` : ''}
    </div>

      ${jd.role_family ? `<span class="tag">${esc(jd.role_family)}</span>` : ''}

      ${jd.domain ? `<span class="tag">${esc(jd.domain)}</span>` : ''}
    </div>
    ${(jd.must_have && jd.must_have.length) ? `<div class="meta">` +
      jd.must_have.slice(0, 12).map(s => `<span class="tag skill">${esc(s)}</span>`).join('') + `</div>` : ''}
    ${d.jd_raw ? `<div class="expand" onclick="this.nextElementSibling.classList.toggle('open')">${t('res.viewjd')}</div>
      <div class="bars"><div class="pre" style="max-height:300px;overflow:auto">${esc(d.jd_raw)}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:7px">${t('res.jdnote')}</div></div>` : ''}
  </div>`;

  if (!top.length) html += `<div style="color:var(--muted);font-size:13px">${t('res.empty')}</div>`;

  top.forEach(h => {
    const bars = barsHTML(h.features);
    html += `<div class="hit">
      <div class="rank ${h.rank === 1 ? 'top' : ''}">${h.rank}</div>
      <div class="hit-main">
        <div class="hit-title">${esc(h.title || t('res.unknown.title'))}<span class="ref">${esc(h.cv_ref)}</span></div>
        <div class="hit-sub">${esc(h.company || '—')}
          ${h.country ? ' · ' + esc(h.country) : ''}
          ${h.years != null ? ' · ' + t('res.yrs.short', { n: trimNum(h.years) }) : ''}
          ${h.seniority ? ' · ' + esc(h.seniority) : ''}</div>
        <div class="hit-reason">${esc(reasonText(h))}</div>
        ${(h.skills_top || []).length ? `<div class="hit-skills">` +
          h.skills_top.slice(0, 8).map(s => `<span>${esc(s)}</span>`).join('') + `</div>` : ''}
        <div class="expand" onclick="this.nextElementSibling.classList.toggle('open')">${t('res.expand')}</div>
        <span class="open-link" onclick="openFile('cv','${esc(h.cv_ref)}')">${t('res.opencv')}</span>
        <span class="open-link" style="margin-left:14px" onclick="openDetail('${esc(h.cv_ref)}')">${t('res.detail')}</span>
        <div class="bars">${bars}</div>
      </div>
      <div class="score">${h.score.toFixed(2)}</div>
    </div>`;
  });

  $('result').innerHTML = html;
  $('result').style.display = 'block';
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

  const hit = currentResults.find(x => x.cv_ref === ref);
  detailRef = ref;
  $('mask').classList.add('on');
  $('drawer').classList.add('on');
  $('d-title').textContent = ref;
  $('d-sub').textContent = hit
    ? t('d.rank', { r: hit.rank, s: hit.score.toFixed(2) }) : '';
  $('d-body').innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px 0">${t('d.loading')}</div>`;

  let d;
  try {
    const r = await fetch('/api/cv/' + encodeURIComponent(ref));
    d = await r.json();
  } catch (e) {
    $('d-body').innerHTML = `<div style="color:var(--bad);font-size:13px">${t('d.loadfail')}</div>`;
    return;
  }
  if (!d.ok) {
    $('d-body').innerHTML = `<div style="color:var(--bad);font-size:13px">${esc(apiErr(d))}</div>`;
    return;
  }

  const f = d.fields || {};
  const dv = d.derived || {};
  let html = '';

  if (hit) {
    html += `<div class="sec">${t('d.sec.match')}</div>
      <div class="hit-reason" style="margin-top:0">${esc(reasonText(hit))}</div>
      <div style="margin-top:10px">${barsHTML(hit.features)}</div>`;
  }

  html += `<div class="sec">${t('d.sec.fields')}</div><div class="kv">
    <span class="k">${t('d.kv.title')}</span><span>${esc(f.current_title || '—')}</span>
    <span class="k">${t('d.kv.company')}</span><span>${esc(f.current_company || '—')}</span>
    <span class="k">${t('d.kv.country')}</span><span>${esc(f.country || '—')}</span>
    <span class="k">${t('d.kv.years')}</span><span>${dv.years != null ? t('d.years', { n: trimNum(dv.years) }) : t('d.unknown')}</span>
    <span class="k">${t('d.kv.seniority')}</span><span>${esc(dv.seniority || t('d.unknown'))}</span>
    <span class="k">${t('d.kv.degree')}</span><span>${esc(f.highest_degree || t('d.unknown'))}</span>
    <span class="k">${t('d.kv.domain')}</span><span>${esc(f.domain || t('d.unknown'))}</span>
  </div>`;

  if ((f.skills || []).length) {
    html += `<div class="sec">${t('d.skills', { n: f.skills.length })}</div>
      <div class="hit-skills" style="margin-top:0">` +
      f.skills.map(s => `<span>${esc(s)}</span>`).join('') + `</div>`;
  }

  if ((f.work_history || []).length) {
    html += `<div class="sec">${t('d.work')}</div>`;
    f.work_history.forEach(job => {
      html += `<div style="margin-bottom:12px;padding-left:11px;border-left:2px solid #e5e7eb">
        <div style="font-size:13.5px;font-weight:600">${esc(job.title || '')}</div>
        <div style="font-size:12px;color:var(--muted)">
          ${esc(job.company || '')} · ${esc(job.start || '')} – ${esc(job.end || '')}</div>
        <div style="font-size:12.5px;color:#4b5563;margin-top:4px;line-height:1.7">
          ${esc(job.description || '')}</div>
      </div>`;
    });
  }

  if (f.education) {
    html += `<div class="sec">${t('d.edu')}</div>
      <div style="font-size:13px;color:#374151;line-height:1.7">${esc(f.education)}</div>`;
  }

  html += `<div class="sec">${t('d.origin')}</div>
    <div style="font-size:12.5px;color:#6b7280;margin-bottom:9px;line-height:1.65">${t('d.origin.note')}</div>
    <button class="btn-ghost" onclick="openFile('cv','${esc(ref)}')">${t('d.open', { r: esc(ref) })}</button>`;

  $('d-body').innerHTML = html;
  if (!silent) $('d-body').scrollTop = 0;
}

function closeDetail() {
  detailRef = null;
  $('mask').classList.remove('on');
  $('drawer').classList.remove('on');
}

/* 用系统默认程序打开原文件（PDF → 阅读器，docx → Word） */
async function openFile(kind, name) {
  try {
    const r = await fetch('/api/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind, name })
    });
    const d = await r.json();
    if (!d.ok) showErr(apiErr(d));
  } catch (e) {
    showErr(t('d.openfail', { e: e.message }));
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDetail(); $('langMenu').classList.remove('on'); }
});

/* ===================== 库管理 ===================== */
let labelTimer = null;

function toggleLib() {
  const b = $('libBody');
  const open = (!b.style.display || b.style.display === 'none');
  b.style.display = open ? 'block' : 'none';
  $('libToggle').textContent = open ? t('lib.collapse') : t('lib.expand');
  if (open) { loadLibrary(); loadGroups(); }
}

async function loadLibrary() {
  try {
    const r = await fetch('/api/library');
    lastLib = await r.json();
    renderLibStat();
    const running = lastLib.label_state && lastLib.label_state.running;
    if (running) pollLabel();
  } catch (e) {
    $('libstat').textContent = t('lib.readfail');
  }
}

function renderLibStat() {
  if (!lastLib) return;
  const s = lastLib.summary || [];
  $('libstat').innerHTML = s.map(x =>
    `<b>${x.kind}</b> ` + t('lib.stat', { r: x.raw, l: x.labelled }) +
    (x.pending ? ` / <span style="color:var(--warn)">` +
      t('lib.pending.stat', { n: x.pending }) + `</span>` : '')
  ).join('　·　');
  renderLabelInfo();
}

function renderLabelInfo() {
  if (!lastLib) { $('labelInfo').textContent = ''; return; }
  const kind = $('upKind').value;
  const row = (lastLib.summary || []).find(x => x.kind.toLowerCase() === kind);
  const pend = row ? row.pending : 0;
  const running = lastLib.label_state && lastLib.label_state.running;
  $('labelInfo').textContent = pend
    ? t('lib.pending.hint', { n: pend }) : t('lib.nopending');
  $('btnLabel').disabled = !pend || running;
  $('btnLabel').dataset.busy = running ? '1' : '0';
  $('btnLabel').textContent = running ? t('lib.labeling') : t('lib.label');
}

async function loadGroups() {
  const kind = $('upKind').value;
  try {
    const r = await fetch('/api/groups');
    const g = await r.json();
    const sel = $('upGroup');
    const cur = sel.value;
    const list = g[kind] || ['默认组'];
    sel.innerHTML = list.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
    if (list.includes(cur)) sel.value = cur;
  } catch (e) {}
}

async function newGroup() {
  const name = prompt(t('lib.group.prompt'));
  if (!name || !name.trim()) return;
  const kind = $('upKind').value;
  try {
    const r = await fetch('/api/group', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind, group: name.trim() })
    });
    const d = await r.json();
    if (!d.ok) { showErr(apiErr(d)); return; }
    await loadGroups();
    $('upGroup').value = name.trim();
    loadLibrary();
  } catch (e) { showErr(t('lib.group.fail', { e: e.message })); }
}

$('upFiles').onchange = async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  const kind = $('upKind').value, group = $('upGroup').value;
  const fd = new FormData();
  fd.append('kind', kind);
  fd.append('group', group);
  files.forEach(f => fd.append('files', f));
  $('upInfo').textContent = t('lib.uploading', { n: files.length });
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (!d.ok) { $('upInfo').textContent = apiErr(d); return; }
    let msg = t('lib.uploaded', { n: d.count, g: d.group });
    if (d.skipped && d.skipped.length) {
      msg += t('lib.skipped', {
        n: d.skipped.length, list: d.skipped.map(s => s[1]).join(LANG === 'zh' ? '；' : '; ')
      });
    }
    $('upInfo').textContent = msg;
    $('upFiles').value = '';
    loadLibrary();
  } catch (err) { $('upInfo').textContent = t('lib.uploadfail', { e: err.message }); }
};

async function startLabel() {
  const kind = $('upKind').value;
  $('btnLabel').disabled = true;
  $('btnLabel').dataset.busy = '1';
  $('btnLabel').textContent = t('lib.labeling');
  $('labelProgress').style.display = 'block';
  try {
    const r = await fetch('/api/label', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind })
    });
    const d = await r.json();
    if (!d.ok) {
      showErr(apiErr(d));
      $('btnLabel').disabled = false;
      $('btnLabel').dataset.busy = '0';
      $('btnLabel').textContent = t('lib.label');
      $('labelProgress').style.display = 'none';
      return;
    }
    pollLabel();
  } catch (e) {
    showErr(t('lib.startfail', { e: e.message }));
    $('btnLabel').dataset.busy = '0';
    $('btnLabel').textContent = t('lib.label');
  }
}

function phaseText(p) {
  if (!p) return '';
  if (typeof p === 'string') return p;
  if (p.action === 'extract') return t('lib.ph.extract', { i: p.i, n: p.n, f: p.file });
  if (p.action === 'embed') return t('lib.ph.embed', { i: p.i, n: p.n, f: p.file });
  if (p.action === 'prepare') return t('lib.preparing');
  if (p.action === 'text') return p.text || '';
  return '';
}

function messageText(m, fails) {
  let s = '';
  if (typeof m === 'string') s = m;
  else if (m && m.code === 'done') s = t('lib.msg.done', { ok: m.ok, n: m.fail });
  else if (m && m.code === 'error') s = t('lib.msg.error', { e: m.msg });
  if (fails && fails.length) {
    s += t('lib.msg.fails', {
      list: fails.map(f => f.file + '（' + f.error + '）').join(LANG === 'zh' ? '；' : '; ')
    });
  }
  return s;
}

function renderPhase() {
  if (!lastPhase) return;
  const pct = lastPhase.total ? Math.round((lastPhase.done / lastPhase.total) * 100) : 0;
  $('lpBar').style.width = pct + '%';
  $('lpPct').textContent = pct + '%';
  $('lpMsg').textContent = phaseText(lastPhase.phase);
}

function pollLabel() {
  clearInterval(labelTimer);
  labelTimer = setInterval(async () => {
    try {
      const r = await fetch('/api/label_status');
      const s = await r.json();
      lastPhase = s;
      renderPhase();
      if (!s.running) {
        clearInterval(labelTimer);
        $('btnLabel').dataset.busy = '0';
        $('btnLabel').textContent = t('lib.label');
        $('lpMsg').textContent = messageText(s.message, s.fails);
        loadLibrary();
      }
    } catch (e) {}
  }, 1200);
}

/* ===================== 启动 ===================== */
applyStatic();
renderStatus();
$('examples').innerHTML = `<span class="chip plain">${t('up.ex.loading')}</span>`;
loadLibrary();
</script>
</body>
</html>
